# Configuração do nginx pra servir o frontend (uma SPA — Single Page
# Application, tudo roda dentro de um HTML só, o React Router decide o
# que mostrar pra cada endereço).
server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;

    # Sem essa linha, recarregar a página em qualquer rota que não seja
    # "/" (ex: /checkin/conferencia) dá 404 — o nginx tentaria achar um
    # ARQUIVO de verdade com esse nome no disco, mas quem sabe o que
    # mostrar ali é o React Router, rodando dentro do JavaScript. Essa
    # regra diz: "se não achar um arquivo com esse nome, devolve o
    # index.html mesmo assim" — e o React cuida do resto.
    try_files $uri /index.html;
  }
}
